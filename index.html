<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHD Goal Tracker & Monthly Task Widget</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* Main Pastel Theme */
      --bg-color: #FCEFE7;
      --card-border: #E8D5C4;
      --text-dark: #2C3531;
      --primary-green: #6F8070;
      --primary-green-hover: #5A6A5B;

      /* Goal Type Aesthetics */
      --small-bg: #E2ECE4;
      --small-border: #A3B899;

      --big-bg: #F5EBE0;
      --big-border: #D8C3A5;

      --future-bg: #ECE8F2;
      --future-border: #C5BDD8;

      --shadow-soft: rgba(44, 53, 49, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 840px;
    }

    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px var(--shadow-soft);
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--primary-green);
      color: #FFFFFF;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(111, 128, 112, 0.2);
    }

    .btn:hover {
      background: var(--primary-green-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: #FFFFFF;
      border-color: var(--primary-green);
    }

    #search-input {
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      background: #FFFFFF;
      outline: none;
      width: 130px;
      color: var(--text-dark);
    }

    #search-input:focus {
      border-color: var(--primary-green);
    }

    .streak-badge {
      background: #FEF3C7;
      color: #B45309;
      border: 1px solid #FDE68A;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    /* --- SIMPLIFIED MONTHLY TASKS WIDGET --- */
    .quick-widget-card {
      background: #FFFFFF;
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px var(--shadow-soft);
    }

    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .widget-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quick-add-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .quick-add-bar input {
      flex: 1;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      outline: none;
    }

    .quick-add-bar input:focus {
      border-color: var(--primary-green);
    }

    .monthly-task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .monthly-task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-color);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 12px;
      transition: background 0.2s;
    }

    .monthly-task-item.completed {
      opacity: 0.55;
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .task-left input[type="checkbox"] {
      accent-color: var(--primary-green);
      cursor: pointer;
      width: 15px;
      height: 15px;
    }

    /* --- SECTIONS WRAPPER --- */
    .sections-wrapper {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .category-section {
      border-radius: 18px;
      overflow: hidden;
      transition: all 0.2s ease;
      border: 1.5px solid rgba(0, 0, 0, 0.05);
    }

    .category-section.type-small { background-color: var(--small-bg); border-color: var(--small-border); }
    .category-section.type-big { background-color: var(--big-bg); border-color: var(--big-border); }
    .category-section.type-future { background-color: var(--future-bg); border-color: var(--future-border); }

    .category-header {
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .category-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-pill {
      background: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      color: var(--text-dark);
    }

    .category-toggle-icon {
      font-size: 12px;
      transition: transform 0.25s ease;
    }

    .category-section.collapsed .category-toggle-icon {
      transform: rotate(-90deg);
    }

    .category-content {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      transition: all 0.3s ease;
    }

    .category-section.collapsed .category-content {
      display: none;
    }

    .empty-section-msg {
      font-size: 12px;
      opacity: 0.6;
      font-style: italic;
      padding: 8px 6px;
      grid-column: 1 / -1;
    }

    .goal-card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 14px;
      border: 1.5px solid rgba(0,0,0,0.08);
      padding: 14px;
      box-shadow: 0 4px 10px var(--shadow-soft);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .goal-title-input {
      border: none;
      background: transparent;
      font-weight: 800;
      font-size: 14px;
      color: var(--text-dark);
      outline: none;
      width: 100%;
    }

    .goal-title-input:focus {
      background: #FFFFFF;
      border-radius: 4px;
      padding: 1px 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #EF4444;
      cursor: pointer;
      font-size: 14px;
      opacity: 0.5;
      transition: opacity 0.15s;
    }

    .delete-btn:hover { opacity: 1; }

    /* Progress Bar */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-green);
    }

    .progress-track {
      background: rgba(0,0,0,0.08);
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary-green);
      width: 0%;
      border-radius: 4px;
      transition: width 0.25s ease;
    }

    .slider-input {
      width: 100%;
      accent-color: var(--primary-green);
      cursor: pointer;
    }

    /* Highlighted Next Action Box */
    .next-action-container {
      background: #FFFFFF;
      border: 1.5px solid var(--primary-green);
      border-radius: 10px;
      padding: 6px 8px;
    }

    .field-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--primary-green);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-dark);
      outline: none;
    }

    input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
      border-color: var(--primary-green);
      background: #FFFFFF;
    }

    /* Collapsible Details */
    details {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      padding: 6px 8px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    summary {
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: var(--primary-green);
      outline: none;
      padding: 2px 0;
    }

    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .milestone-item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .milestone-item input[type="checkbox"] {
      accent-color: var(--primary-green);
      cursor: pointer;
    }

    .milestone-item input[type="text"] {
      border: none;
      background: transparent;
      padding: 0;
    }

    .milestone-item input[type="text"].done {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(44, 53, 49, 0.45);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-card {
      background: #FFFFFF;
      border: 2px solid var(--primary-green);
      border-radius: 20px;
      padding: 24px;
      width: 380px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-card h3 {
      color: var(--primary-green);
      font-size: 18px;
      margin-bottom: 12px;
    }

    .modal-action-box {
      background: var(--bg-color);
      border-radius: 12px;
      padding: 14px;
      margin: 14px 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      border: 1px dashed var(--primary-green);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Top Navigation Bar -->
    <header>
      <div class="nav-actions">
        <button class="btn" onclick="triggerTodaysMove()">🎯 Today's One Move</button>
        <button class="btn btn-secondary" onclick="addGoal('small')">🌱 + Small Goal</button>
        <button class="btn btn-secondary" onclick="addGoal('big')">✦ + Big Goal</button>
        <button class="btn btn-secondary" onclick="addGoal('future')">☾ + Future Goal</button>
      </div>

      <div class="nav-actions">
        <input type="text" id="search-input" placeholder="🔍 Search..." oninput="filterGoals()">
        <div class="streak-badge" id="streak-counter">🔥 0 Days</div>
      </div>
    </header>

    <!-- ⚡ SIMPLIFIED QUICK MONTHLY FOCUS WIDGET -->
    <div class="quick-widget-card">
      <div class="widget-header">
        <div class="widget-title">📌 Main Tasks for the Month (Quick View)</div>
        <span style="font-size: 11px; opacity: 0.7;" id="monthly-count">0 tasks</span>
      </div>

      <div class="quick-add-bar">
        <input type="text" id="monthly-task-input" placeholder="Add quick monthly task..." onkeydown="handleMonthlyTaskKey(event)">
        <button class="btn" onclick="addMonthlyTask()">+ Add Task</button>
      </div>

      <div class="monthly-task-list" id="monthly-task-container">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Roll-Down Accordion Category Sections -->
    <div class="sections-wrapper">

      <!-- 🌱 Small Goals Section -->
      <div class="category-section type-small" id="sec-small">
        <div class="category-header" onclick="toggleSection('small')">
          <div class="category-title">
            🌱 Small Goals <span class="count-pill" id="count-small">0</span>
          </div>
          <span class="category-toggle-icon" id="icon-small">▼</span>
        </div>
        <div class="category-content" id="content-small"></div>
      </div>

      <!-- ✦ Big Goals Section -->
      <div class="category-section type-big" id="sec-big">
        <div class="category-header" onclick="toggleSection('big')">
          <div class="category-title">
            ✦ Big Goals <span class="count-pill" id="count-big">0</span>
          </div>
          <span class="category-toggle-icon" id="icon-big">▼</span>
        </div>
        <div class="category-content" id="content-big"></div>
      </div>

      <!-- ☾ Future Goals Section -->
      <div class="category-section type-future" id="sec-future">
        <div class="category-header" onclick="toggleSection('future')">
          <div class="category-title">
            ☾ Future Goals <span class="count-pill" id="count-future">0</span>
          </div>
          <span class="category-toggle-icon" id="icon-future">▼</span>
        </div>
        <div class="category-content" id="content-future"></div>
      </div>

    </div>
  </div>

  <!-- "Today's One Move" Focus Modal -->
  <div class="modal-overlay" id="focus-modal">
    <div class="modal-card">
      <h3>🎯 Today's One Move</h3>
      <p style="font-size: 12px; opacity: 0.8;" id="focus-goal-title">Goal Name</p>

      <div class="modal-action-box" id="focus-action-text">
        Next action step will appear here!
      </div>

      <button class="btn" style="width: 100%; justify-content: center;" onclick="closeModal('focus-modal')">Let's Do It!</button>
    </div>
  </div>

  <script>
    let goals = [];
    let monthlyTasks = [];
    let streakData = { count: 0, lastActiveDate: null };
    let collapsedState = { small: false, big: false, future: false };

    // Audio Context Synthesizer (Web Audio API)
    let audioCtx = null;

    function playSynthesizedChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

          gain.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.08 + 0.4);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + idx * 0.08);
          osc.stop(audioCtx.currentTime + idx * 0.08 + 0.45);
        });
      } catch (e) {
        console.log("Audio play blocked or unsupported:", e);
      }
    }

    function triggerCelebration() {
      playSynthesizedChime();
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      checkDailyStreak();
      render();
    });

    function saveData() {
      localStorage.setItem('adhd_goals_roll_down', JSON.stringify({ goals, monthlyTasks, streakData, collapsedState }));
    }

    function loadData() {
      const raw = localStorage.getItem('adhd_goals_roll_down');
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          goals = parsed.goals || [];
          monthlyTasks = parsed.monthlyTasks || [];
          streakData = parsed.streakData || { count: 0, lastActiveDate: null };
          collapsedState = parsed.collapsedState || { small: false, big: false, future: false };
        } catch (e) {
          console.error("Could not parse saved data", e);
        }
      }
    }

    /* --- QUICK MONTHLY TASKS HANDLERS --- */
    function handleMonthlyTaskKey(e) {
      if (e.key === 'Enter') addMonthlyTask();
    }

    function addMonthlyTask() {
      const input = document.getElementById('monthly-task-input');
      const val = input.value.trim();
      if (!val) return;

      monthlyTasks.unshift({
        id: 'm_' + Date.now(),
        text: val,
        done: false
      });

      input.value = '';
      registerActivity();
      saveData();
      renderMonthlyTasks();
    }

    function toggleMonthlyTask(id) {
      const task = monthlyTasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        if (task.done) {
          triggerCelebration();
        }
        registerActivity();
        saveData();
        renderMonthlyTasks();
      }
    }

    function deleteMonthlyTask(id) {
      monthlyTasks = monthlyTasks.filter(t => t.id !== id);
      saveData();
      renderMonthlyTasks();
    }

    function renderMonthlyTasks() {
      const container = document.getElementById('monthly-task-container');
      const countLabel = document.getElementById('monthly-count');
      container.innerHTML = '';

      countLabel.innerText = `${monthlyTasks.filter(t => t.done).length}/${monthlyTasks.length} done`;

      if (monthlyTasks.length === 0) {
        container.innerHTML = `<div class="empty-section-msg">No monthly focus tasks set yet. Add one above!</div>`;
        return;
      }

      monthlyTasks.forEach(task => {
        const item = document.createElement('div');
        item.className = `monthly-task-item ${task.done ? 'completed' : ''}`;
        item.innerHTML = `
          <div class="task-left">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleMonthlyTask('${task.id}')">
            <span>${escapeHtml(task.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteMonthlyTask('${task.id}')" title="Delete">✕</button>
        `;
        container.appendChild(item);
      });
    }

    /* --- STREAK & GOALS HANDLERS --- */
    function checkDailyStreak() {
      const today = new Date().toISOString().split('T')[0];
      if (streakData.lastActiveDate) {
        const last = new Date(streakData.lastActiveDate);
        const current = new Date(today);
        const diffDays = Math.round((current - last) / (1000 * 60 * 60 * 24));

        if (diffDays > 1) {
          streakData.count = 0;
        }
      }
      renderStreakUI();
    }

    function registerActivity() {
      const today = new Date().toISOString().split('T')[0];
      if (streakData.lastActiveDate !== today) {
        streakData.count = (streakData.count || 0) + 1;
        streakData.lastActiveDate = today;
        saveData();
        renderStreakUI();
      }
    }

    function renderStreakUI() {
      document.getElementById('streak-counter').innerText = `🔥 ${streakData.count || 0} Day${streakData.count === 1 ? '' : 's'}`;
    }

    function toggleSection(type) {
      collapsedState[type] = !collapsedState[type];
      const sec = document.getElementById(`sec-${type}`);
      if (collapsedState[type]) {
        sec.classList.add('collapsed');
      } else {
        sec.classList.remove('collapsed');
      }
      saveData();
    }

    function syncSectionCollapseStates() {
      ['small', 'big', 'future'].forEach(type => {
        const sec = document.getElementById(`sec-${type}`);
        if (collapsedState[type]) sec.classList.add('collapsed');
        else sec.classList.remove('collapsed');
      });
    }

    function addGoal(type = 'small') {
      collapsedState[type] = false; // ensure expanded
      const id = 'g_' + Date.now() + Math.random().toString(36).substr(2, 4);
      const newGoal = {
        id,
        type,
        title: '',
        progress: 0,
        nextAction: '',
        deadline: '',
        why: '',
        successDef: '',
        projects: '',
        obstacles: '',
        resources: '',
        milestones: []
      };
      goals.unshift(newGoal);
      registerActivity();
      saveData();
      render();

      setTimeout(() => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const titleInput = el.querySelector('.goal-title-input');
          if (titleInput) titleInput.focus();
        }
      }, 100);
    }

    function updateGoal(id, key, val) {
      const g = goals.find(item => item.id === id);
      if (g) {
        g[key] = val;
        registerActivity();
        saveData();
      }
    }

    function updateProgress(id, val) {
      const g = goals.find(item => item.id === id);
      if (g) {
        const prev = g.progress;
        g.progress = parseInt(val);
        if (g.progress === 100 && prev < 100) {
          triggerCelebration();
        }
        registerActivity();
        saveData();
        render();
      }
    }

    function deleteGoal(id) {
      goals = goals.filter(item => item.id !== id);
      saveData();
      render();
    }

    function addMilestone(goalId) {
      const g = goals.find(item => item.id === goalId);
      if (g) {
        if (!g.milestones) g.milestones = [];
        g.milestones.push({ text: 'New step', done: false });
        saveData();
        render();
      }
    }

    function toggleMilestone(goalId, idx) {
      const g = goals.find(item => item.id === goalId);
      if (g && g.milestones[idx]) {
        g.milestones[idx].done = !g.milestones[idx].done;
        if (g.milestones[idx].done) {
          triggerCelebration();
        }
        saveData();
        render();
      }
    }

    function updateMilestoneText(goalId, idx, text) {
      const g = goals.find(item => item.id === goalId);
      if (g && g.milestones[idx]) {
        g.milestones[idx].text = text;
        saveData();
      }
    }

    function render() {
      syncSectionCollapseStates();
      renderMonthlyTasks();

      ['small', 'big', 'future'].forEach(type => {
        const container = document.getElementById(`content-${type}`);
        const countBadge = document.getElementById(`count-${type}`);
        container.innerHTML = '';

        const typeGoals = goals.filter(g => g.type === type);
        countBadge.innerText = typeGoals.length;

        if (typeGoals.length === 0) {
          container.innerHTML = `<div class="empty-section-msg">No goals here yet. Click header button to add!</div>`;
          return;
        }

        typeGoals.forEach(goal => {
          const card = document.createElement('div');
          card.className = 'goal-card';
          card.id = goal.id;

          const glowAlpha = 0.05 + (goal.progress / 100) * 0.4;
          const glowBlur = 6 + Math.round((goal.progress / 100) * 16);
          card.style.boxShadow = `0 4px ${glowBlur}px rgba(111, 128, 112, ${glowAlpha})`;

          if (goal.progress === 100) {
            card.style.borderColor = '#10B981';
          }

          card.innerHTML = `
            <div class="card-top">
              <input type="text" class="goal-title-input" placeholder="Goal Title..." 
                     value="${escapeHtml(goal.title)}" onchange="updateGoal('${goal.id}', 'title', this.value)">
              <button class="delete-btn" onclick="deleteGoal('${goal.id}')" title="Delete Goal">✕</button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
              <div class="progress-header">
                <span>Progress</span>
                <span>${goal.progress}%</span>
              </div>
              <div class="progress-track">
                <div class="progress-fill" style="width: ${goal.progress}%"></div>
              </div>
              <input type="range" class="slider-input" min="0" max="100" value="${goal.progress}" 
                     oninput="updateProgress('${goal.id}', this.value)">
            </div>

            <!-- Next Action -->
            <div class="next-action-container">
              <div class="field-label">
                <span>⚡ Next Action</span>
                <span>📅 <input type="date" style="width: 110px; font-size: 10px; padding: 1px 3px;" value="${goal.deadline || ''}" onchange="updateGoal('${goal.id}', 'deadline', this.value)"></span>
              </div>
              <input type="text" placeholder="What is the immediate next step?" 
                     value="${escapeHtml(goal.nextAction)}" onchange="updateGoal('${goal.id}', 'nextAction', this.value)">
            </div>

            <!-- Collapsible 7 Breakdown Fields Details -->
            <details>
              <summary>🧩 All Goal Details (Why, Steps, Obstacles...)</summary>
              <div class="details-grid">

                <div>
                  <span class="field-label">💡 Why?</span>
                  <input type="text" placeholder="Why does this matter to you?" value="${escapeHtml(goal.why)}" onchange="updateGoal('${goal.id}', 'why', this.value)">
                </div>

                <div>
                  <span class="field-label">🎯 Success Definition</span>
                  <input type="text" placeholder="How do you know it's complete?" value="${escapeHtml(goal.successDef)}" onchange="updateGoal('${goal.id}', 'successDef', this.value)">
                </div>

                <div>
                  <span class="field-label">🧩 Milestones Checklist</span>
                  ${renderMilestones(goal)}
                  <button class="btn btn-secondary" style="font-size: 10px; padding: 2px 6px; margin-top: 4px;" onclick="addMilestone('${goal.id}')">+ Step</button>
                </div>

                <div>
                  <span class="field-label">📁 Projects</span>
                  <input type="text" placeholder="Related projects or folders" value="${escapeHtml(goal.projects)}" onchange="updateGoal('${goal.id}', 'projects', this.value)">
                </div>

                <div>
                  <span class="field-label">🚧 Obstacles</span>
                  <input type="text" placeholder="What might block you?" value="${escapeHtml(goal.obstacles)}" onchange="updateGoal('${goal.id}', 'obstacles', this.value)">
                </div>

                <div>
                  <span class="field-label">🧰 Resources</span>
                  <input type="text" placeholder="Links, tools, or contacts" value="${escapeHtml(goal.resources)}" onchange="updateGoal('${goal.id}', 'resources', this.value)">
                </div>

              </div>
            </details>
          `;

          container.appendChild(card);
        });
      });
    }

    function renderMilestones(goal) {
      if (!goal.milestones || goal.milestones.length === 0) return '';
      return goal.milestones.map((m, idx) => `
        <div class="milestone-item">
          <input type="checkbox" ${m.done ? 'checked' : ''} onchange="toggleMilestone('${goal.id}', ${idx})">
          <input type="text" class="${m.done ? 'done' : ''}" value="${escapeHtml(m.text)}" onchange="updateMilestoneText('${goal.id}', ${idx}, this.value)">
        </div>
      `).join('');
    }

    function triggerTodaysMove() {
      const activeGoals = goals.filter(g => g.progress < 100);
      if (activeGoals.length === 0) {
        showFocusModal("No Active Goals!", "Add a goal to get started!");
        return;
      }

      const withActions = activeGoals.filter(g => g.nextAction && g.nextAction.trim() !== '');
      const selected = withActions.length > 0 
        ? withActions[Math.floor(Math.random() * withActions.length)]
        : activeGoals[Math.floor(Math.random() * activeGoals.length)];

      const title = selected.title ? selected.title : "Untitled Goal";
      const action = selected.nextAction ? selected.nextAction : "Add a 'Next Action' to this goal!";

      showFocusModal(title, action);
    }

    function showFocusModal(title, action) {
      document.getElementById('focus-goal-title').innerText = title;
      document.getElementById('focus-action-text').innerText = action;
      document.getElementById('focus-modal').style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function filterGoals() {
      const query = document.getElementById('search-input').value.toLowerCase();
      goals.forEach(g => {
        const el = document.getElementById(g.id);
        if (el) {
          const match = g.title.toLowerCase().includes(query) ||
                        g.nextAction.toLowerCase().includes(query) ||
                        g.why.toLowerCase().includes(query);
          el.style.display = match ? 'flex' : 'none';
        }
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
